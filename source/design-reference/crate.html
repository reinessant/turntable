<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate — design reference</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="deck.css">
<style>
/* =====================================================================
   CRATE LAYOUT — reference 1920 × 1080
   header y 44–76 · sleeve stack centred at (960, 470) · caption under the
   sleeve · footer row y 1008–1040. No turntable on this screen.
   ===================================================================== */
.screen { position: relative; z-index: 1; width: 100vw; height: 100vh; }
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand .h { font: var(--t-title); font-stretch: var(--st-title); letter-spacing: var(--tr-title); color: var(--ink); }
.brand .mono { color: var(--ink-3); }
.hright { display: flex; gap: 8px; align-items: center; }

/* sleeve + peeking record are centred TOGETHER (the record sticks out 135 px right) */
.crate { position: absolute; left: calc(50% - 64px); top: 486px; width: 0; height: 0; }
.sleeve {
  position: absolute; width: 460px; height: 460px; left: -230px; top: -230px;
  transform-origin: 50% 100%; will-change: transform;
}
.sleeve .face {
  position: absolute; inset: 0; border-radius: 3px; overflow: hidden; background: #222;
  box-shadow: var(--shadow-card);
}
.sleeve .face img, .sleeve .face canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.sleeve .face::after { /* card edge highlight + light paper sheen + corner wear */
  content: ""; position: absolute; inset: 0; border-radius: 3px; pointer-events: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(0,0,0,.18);
  background:
    radial-gradient(circle at 0 0, rgba(255,255,255,.10), transparent 3%),
    radial-gradient(circle at 100% 0, rgba(255,255,255,.08), transparent 3%),
    linear-gradient(135deg, rgba(255,255,255,.10), transparent 35%);
}
.sleeve .dim { position: absolute; inset: 0; border-radius: 3px; background: #08080a; pointer-events: none; }
.sleeve .top { /* the top edge of a sleeve standing behind — the "stack" texture */
  position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.22); border-radius: 2px 2px 0 0;
}
/* the vinyl peeking out of the focused sleeve, from BEHIND it */
.peek {
  position: absolute; width: 430px; height: 430px; left: -215px; top: -215px; border-radius: 50%;
  transition: transform 640ms var(--ease-out), opacity 300ms var(--ease-out);
}
.peek .v { position: absolute; inset: 0; border-radius: 50%; animation: spin 10s linear infinite; }
.peek .sh { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: screen;
  background: conic-gradient(from -62deg, transparent, rgba(255,255,255,.2) 14deg, transparent 36deg, transparent 180deg, rgba(255,255,255,.11) 194deg, transparent 216deg);
  -webkit-mask: radial-gradient(circle, transparent 34%, #000 36%); mask: radial-gradient(circle, transparent 34%, #000 36%); }
.peek .lbl { position: absolute; inset: 33%; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.peek .lbl img { width: 100%; height: 100%; object-fit: cover; }
@keyframes spin { to { transform: rotate(360deg); } }

.caption { position: absolute; left: calc(50% - 230px - 64px); top: 752px; width: 760px; }
.caption h2 { font: var(--t-display); font-stretch: var(--st-display); letter-spacing: var(--tr-display); color: var(--ink); transition: opacity 200ms, transform 260ms var(--ease-out); }
.caption .sub { margin-top: 12px; font: var(--t-body-lg); color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; }
.caption .sub .mono { color: var(--ink-3); }

.foot { position: absolute; left: var(--page-x); right: var(--page-x); bottom: var(--page-bottom); height: 32px;
  display: flex; align-items: center; justify-content: space-between; }
.preview { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font: var(--t-small); }
.eq { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
.eq i { width: 2px; background: var(--ink-3); border-radius: 1px; animation: eq 1.1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.4s } .eq i:nth-child(3) { animation-delay: -.8s }
@keyframes eq { 0%,100% { height: 3px } 50% { height: 12px } }
.hint { font: var(--t-micro); letter-spacing: var(--tr-micro); text-transform: uppercase; color: var(--ink-4); }
.count { color: var(--ink-3); }
</style>
</head>
<body>
<div class="backdrop" id="bd">
  <img class="blur" id="bdimg" src="cover.jpg" alt="">
  <div class="tone"></div>
  <div class="glow" id="glow" style="--glow: rgba(58, 86, 255, .5); --glow-y: 44%"></div>
  <div class="vignette"></div>
</div>

<div class="screen">
  <header class="header">
    <div class="brand"><span class="h">Crate</span><span class="mono" id="n">12 albums</span></div>
    <div class="hright">
      <button class="pill-btn"><span data-icon="sort-ascending" data-size="14"></span>Recently added</button>
      <button class="icon-btn"><span data-icon="magnifying-glass"></span></button>
      <button class="pill-btn solid"><span data-icon="plus" data-size="14"></span>Import</button>
    </div>
  </header>

  <div class="crate" id="crate"></div>

  <div class="caption"><h2 id="title">Half Blood</h2><div class="sub"><span id="artist">slayr</span><span class="mono" id="meta">2025 · 12 tracks</span></div></div>

  <footer class="foot">
    <div class="preview"><button class="icon-btn" style="margin-left:-10px"><span data-icon="speaker-high"></span></button><span class="eq"><i></i><i></i><i></i></span><span id="prev">Previewing · Demigod</span></div>
    <div class="hint">Scroll to flip · Enter to play</div>
    <div class="count mono" id="count">01 / 12</div>
  </footer>
</div>
<div class="grain"></div>

<script src="icons.js"></script>
<script>
// Placeholder albums. Album 0 is real; the rest get generated covers so the stack can be judged.
const ALBUMS = [{ t: "Half Blood", a: "slayr", y: 2025, n: 12, cover: "cover.jpg", glow: "rgba(58,86,255,.5)" }];
const PAL = [["#e9e4da","#1b1b1b","#c43b2f"],["#0e1a2b","#5fa8ff","#e8eef7"],["#2a1f16","#e3a24a","#f5e6c8"],["#f1efe9","#9aa39a","#2f3a33"],
  ["#141414","#f2f2f2","#7a7a7a"],["#3b0d1a","#ff5f7e","#ffd1dc"],["#dfe7df","#0e5c46","#a7c4b5"],["#101820","#f7b733","#fc4a1a"],
  ["#e6e0f5","#5b3cc4","#1d1142"],["#1e1e1e","#c0ff3e","#333"],["#f4e9d8","#b04a2e","#2d2a26"]];
const NAMES = [["Low Tide","Mara Vell"],["Night Transit","Kōji"],["Amber Rooms","Odelle"],["Field Notes","Sten Havik"],["Monochrome","Aurel"],
  ["Heartwire","LUXE"],["Greenhouse","Pale Fern"],["Sodium","Arc Lamp"],["Violet Hour","Nimue"],["Acid Garden","DSKTP"],["Terracotta","Ines Moro"]];
function genCover(p, seed) {
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  g.fillStyle = p[0]; g.fillRect(0, 0, 512, 512);
  const r = n => (Math.sin(seed * 999 + n * 77.7) + 1) / 2;
  g.fillStyle = p[1];
  if (seed % 3 === 0) { g.beginPath(); g.arc(160 + r(1) * 190, 180 + r(2) * 150, 90 + r(3) * 70, 0, 7); g.fill(); }
  else if (seed % 3 === 1) { for (let i = 0; i < 9; i++) g.fillRect(0, 60 + i * 44, 512, 10 + r(i) * 16); }
  else { g.fillRect(56, 56, 400 * r(4) + 60, 400 * r(5) + 40); }
  g.fillStyle = p[2]; g.font = "700 26px Geist"; g.fillText(NAMES[seed - 1][0].toUpperCase(), 40, 470);
  return c.toDataURL("image/jpeg", .9);
}
PAL.forEach((p, i) => ALBUMS.push({ t: NAMES[i][0], a: NAMES[i][1], y: 2019 + (i % 6), n: 8 + (i % 5), cover: genCover(p, i + 1), glow: p[1] }));

const crate = document.getElementById("crate");
crate.innerHTML = `<div class="peek" id="peek"><div class="v" id="pv"></div><div class="sh"></div></div>` +
  ALBUMS.map((a, i) => `<div class="sleeve" data-i="${i}"><div class="face"><img src="${a.cover}"></div><div class="top"></div><div class="dim"></div></div>`).join("");
const sleeves = [...crate.querySelectorAll(".sleeve")], peek = document.getElementById("peek");

// vinyl for the peek (same look as the deck record, simplified)
function vinylHTML(cover) {
  return `<div style="position:absolute;inset:0;border-radius:50%;background:
    repeating-radial-gradient(circle, rgba(255,255,255,.035) 0 .5px, transparent .5px 1.8px),
    radial-gradient(circle,#18181b,#111113);box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.5)"></div>
    <div class="lbl"><img src="${cover}"></div>`;
}

// One continuous position, damped toward an integer target. Every sleeve's pose derives from (i − pos).
let pos = 0, target = 0, vel = 0, last = performance.now(), focused = -1, peekTimer;
function pose(d) {
  if (d >= 0) {  // behind: rise and recede, only the tops show
    const k = Math.min(d, 8);
    return { y: -k * 36, s: 1 - k * 0.045, sy: 1, dim: Math.min(.75, k * .13), op: d > 7 ? Math.max(0, 8 - d) : 1, z: 100 - k };
  }
  // flipped past: falls forward around its bottom edge, then fades
  const t = Math.min(1, -d), ease = t * t * (3 - 2 * t);
  return { y: 26 * ease, s: 1 + .03 * ease, sy: Math.cos(ease * 1.3), dim: ease * .7, op: 1 - Math.min(1, Math.max(0, (-d - .3) / .5)), z: 101 + t };
}
function frame(tm) {
  const dt = Math.min(.05, (tm - last) / 1000); last = tm;
  const w = 13, acc = -w * w * (pos - target) - 2 * w * vel; vel += acc * dt; pos += vel * dt;
  sleeves.forEach((el, i) => {
    const p = pose(i - pos);
    el.style.transform = `translateY(${p.y}px) scale(${p.s}, ${p.s * p.sy})`;
    el.style.opacity = Math.max(0, p.op); el.style.zIndex = Math.round(p.z * 10);
    el.querySelector(".dim").style.opacity = p.dim;
    el.style.display = (i - pos) < -1.05 || (i - pos) > 9 ? "none" : "";
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function focus(i) {
  target = Math.max(0, Math.min(ALBUMS.length - 1, i));
  if (target === focused) return; focused = target;
  const a = ALBUMS[target];
  // record slides back in, then out again once the sleeve has settled
  peek.style.transform = "translateX(0) rotate(0)"; peek.style.opacity = 0; peek.style.zIndex = 1000 - 1;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => { document.getElementById("pv").innerHTML = vinylHTML(a.cover); peek.style.zIndex = 1005; peek.style.opacity = 1; peek.style.transform = "translateX(150px)"; }, 520);
  // caption
  const h = document.getElementById("title"); h.style.opacity = 0; h.style.transform = "translateY(-6px)";
  setTimeout(() => { h.textContent = a.t; document.getElementById("artist").textContent = a.a;
    document.getElementById("meta").textContent = `${a.y} · ${a.n} tracks`; h.style.transform = "translateY(6px)";
    requestAnimationFrame(() => { h.style.opacity = 1; h.style.transform = "none"; }); }, 180);
  document.getElementById("count").textContent = `${String(target + 1).padStart(2, "0")} / ${ALBUMS.length}`;
  document.getElementById("prev").textContent = `Previewing · ${["Demigod", "Tide", "Platform 4", "Lanterns", "Sketch II", "Gray", "Pulse", "Moss", "Lamp", "Dusk", "Acid", "Clay"][target]}`;
  // the room takes the sleeve's colour (crossfade the blurred backdrop)
  const img = document.getElementById("bdimg"); img.style.transition = "opacity 260ms"; img.style.opacity = .2;
  setTimeout(() => { img.src = a.cover; img.style.transition = "opacity 520ms"; img.style.opacity = 1; }, 260);
  document.getElementById("glow").style.setProperty("--glow", a.glow.startsWith("rgba") ? a.glow : a.glow + "88");
}
// the peek must sit behind the focused sleeve but in front of the rest: re-stack after z updates
setInterval(() => { const f = sleeves[focused]; if (f) peek.style.zIndex = (+f.style.zIndex || 1000) - 1; }, 100);

let acc = 0;
addEventListener("wheel", e => { e.preventDefault(); acc += e.deltaY; if (Math.abs(acc) > 40) { focus(target + Math.sign(acc)); acc = 0; } }, { passive: false });
addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowDown") focus(target + 1); if (e.key === "ArrowLeft" || e.key === "ArrowUp") focus(target - 1); });
focus(0);
</script>
</body>
</html>
