<!doctype html><html><head><meta charset="utf-8"><title>Font candidates</title>
<link rel="stylesheet" href="tokens.css">
<style>
@font-face{font-family:"Mona Sans";src:url(fonts/candidates/mona-sans-latin-standard-normal.woff2) format("woff2");font-weight:200 900;font-stretch:75% 125%}
@font-face{font-family:"Instrument Serif";src:url(fonts/candidates/instrument-serif-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Unbounded";src:url(fonts/candidates/unbounded-latin-wght-normal.woff2) format("woff2");font-weight:200 900}
@font-face{font-family:"Onest";src:url(fonts/candidates/onest-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Inter Tight";src:url(fonts/candidates/inter-tight-latin-wght-normal.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Space Grotesk";src:url(fonts/candidates/space-grotesk-latin-wght-normal.woff2) format("woff2");font-weight:300 700}
body{overflow:auto}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:48px 64px}
.c{padding:32px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);height:440px;position:relative}
.tag{font:500 11px/1 Geist;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:28px;display:flex;justify-content:space-between}
.d{font-size:52px;line-height:1;letter-spacing:-.035em;color:var(--ink)}
.a{margin-top:12px;font:450 16px/1.4 Geist;color:var(--ink-2)}
.l1{margin-top:44px;font-size:30px;line-height:1.2;letter-spacing:-.02em;color:var(--ink)}
.l2{margin-top:14px;font-size:22px;line-height:1.3;color:var(--ink-3)}
.r{margin-top:34px;display:flex;justify-content:space-between;font-size:15px;color:var(--ink-2);padding:10px 12px;border-radius:8px;background:var(--ink-6)}
</style></head><body>
<div class="backdrop"><img class="blur" src="cover.jpg"><div class="tone"></div><div class="vignette"></div></div>
<div class="grid" id="g"></div><div class="grain"></div>
<script>
const C=[
 ["A · Geist (current)","Geist","font-weight:600","Geist","font-weight:600","Geist","Cyrillic ✓"],
 ["B · Mona Sans Expanded","Mona Sans","font-weight:700;font-stretch:115%;letter-spacing:-.045em","Mona Sans","font-weight:600;font-stretch:105%","Mona Sans","Latin only"],
 ["C · Instrument Serif + Geist","Instrument Serif","font-weight:400;font-size:60px;letter-spacing:-.02em","Instrument Serif","font-weight:400;font-size:34px;letter-spacing:-.01em","Geist","Display latin only"],
 ["D · Unbounded (display) + Geist","Unbounded","font-weight:600;font-size:40px;letter-spacing:-.04em","Geist","font-weight:600","Geist","Cyrillic ✓"],
 ["E · Onest","Onest","font-weight:600","Onest","font-weight:600","Onest","Cyrillic ✓"],
 ["F · Inter Tight","Inter Tight","font-weight:600;letter-spacing:-.045em","Inter Tight","font-weight:600","Inter Tight","Cyrillic ✓"],
];
g.innerHTML=C.map(([n,df,ds,lf,ls,uf,cy])=>`<div class="c"><div class="tag"><span>${n}</span><span>${cy}</span></div>
<div class="d" style="font-family:'${df}';${ds}">Half Blood</div><div class="a">slayr · 2025 · 12 tracks</div>
<div class="l1" style="font-family:'${lf}';${ls}">The active line sits here, larger</div>
<div class="l2" style="font-family:'${lf}';font-weight:500">The next line waits dimmer</div>
<div class="r" style="font-family:'${uf}'"><span>03 &nbsp; Sloppy Joe</span><span style="font-family:Geist Mono;font-size:12px">2:26</span></div></div>`).join("");
</script></body></html>
