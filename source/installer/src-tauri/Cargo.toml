[package]
name = "turntable-setup"
version = "0.1.0"
description = "Turntable installer"
authors = ["reinessant"]
license = "MIT"
repository = "https://github.com/reinessant/turntable"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
